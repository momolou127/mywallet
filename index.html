<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-title" content="我的钱包">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>我的钱包</title>
<style>
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --primary: #6366f1;
  --primary-light: #818cf8;
  --primary-bg: #eef2ff;
  --text: #1d1d1f;
  --text-1: #1d1d1f;
  --text-2: #6e6e73;
  --text-3: #aeaeb2;
  --border: #e5e5ea;
  --green: #34c759;
  --red: #ff3b30;
  --orange: #ff9500;
  --nav-bg: rgba(255,255,255,0.92);
  --chart-grid: #f0f0f0;
  --chart-text: #aeaeb2;
  --chart-base: #cfcfcf;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.04);
  --radius: 16px;
}

/* 深色模式 */
[data-theme="dark"] {
  --bg: #0f1115;
  --card: #1a1d24;
  --primary: #818cf8;
  --primary-light: #a5b4fc;
  --primary-bg: #1e1b4b;
  --text: #f2f3f5;
  --text-1: #f2f3f5;
  --text-2: #9aa0a6;
  --text-3: #6e747b;
  --border: #2a2e37;
  --green: #4ade80;
  --red: #f87171;
  --orange: #fbbf24;
  --nav-bg: rgba(26,29,36,0.92);
  --chart-grid: #2a2e37;
  --chart-text: #6e747b;
  --chart-base: #4a4f57;
  --shadow: 0 1px 3px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.35);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.55), 0 4px 12px rgba(0,0,0,0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  background: var(--bg);
  color: var(--text);
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* ===== 头部 ===== */
.header {
  background: var(--card);
  padding: 16px 20px 12px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 0.5px solid var(--border);
}
.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.app-title {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.header-actions {
  display: flex;
  gap: 8px;
}
.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s;
}
.icon-btn:active { transform: scale(0.9); }
/* 暂时不需要的功能按钮：隐藏但保留代码，便于日后恢复 */
.hidden-btn { display: none !important; }

/* 总览卡 */
.total-card {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  border-radius: 20px;
  padding: 24px 20px;
  color: white;
  margin-bottom: 4px;
  box-shadow: 0 4px 20px rgba(99,102,241,0.3);
}
.total-label {
  font-size: 13px;
  opacity: 0.85;
  margin-bottom: 6px;
}
.total-amount {
  font-size: 36px;
  font-weight: 800;
  letter-spacing: -1px;
  font-variant-numeric: tabular-nums;
}
.total-amount .currency {
  font-size: 18px;
  font-weight: 600;
  margin-right: 4px;
  opacity: 0.9;
}
.total-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
  font-size: 12px;
  opacity: 0.9;
}
.total-meta .change-up { color: #d1fae5; }
.total-meta .change-down { color: #fecaca; }

/* ===== 标签切换 ===== */
.tabs {
  display: flex;
  gap: 6px;
  padding: 16px 20px 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  padding: 8px 16px;
  border-radius: 20px;
  background: var(--card);
  border: 0.5px solid var(--border);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-2);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.tab.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}
.tab .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.6;
}

/* ===== 内容区 ===== */
.content {
  padding: 0 20px 100px;
}

/* 项目卡 */
.project-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  transition: transform 0.15s;
}
.project-card:active { transform: scale(0.98); }
.project-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}
.project-info {
  flex: 1;
}
.project-name {
  font-size: 16px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
.project-color {
  width: 10px;
  height: 10px;
  border-radius: 3px;
}
.project-latest {
  font-size: 24px;
  font-weight: 700;
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.5px;
}
.project-change {
  font-size: 12px;
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}
.project-change.up { color: var(--green); }
.project-change.down { color: var(--red); }
.project-change.flat { color: var(--text-3); }
.project-actions {
  display: flex;
  gap: 6px;
}
.mini-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: var(--bg);
  color: var(--text-2);
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.mini-btn:active { transform: scale(0.9); }

/* 目标进度 */
.goal-bar {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 0.5px solid var(--border);
}
.goal-bar-header {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-2);
  margin-bottom: 6px;
}
.goal-bar-track {
  height: 6px;
  background: var(--bg);
  border-radius: 3px;
  overflow: hidden;
}
.goal-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--primary-light));
  border-radius: 3px;
  transition: width 0.4s;
}

/* 折线图 */
.chart-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.chart-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--text);
}
.chart-svg {
  width: 100%;
  display: block;
}

/* 时间轴 */
.timeline-section { margin-top: 8px; }
.timeline-date-group {
  margin-bottom: 20px;
}
.timeline-date {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 8px;
  padding-left: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.timeline-date::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--primary);
}
.timeline-item {
  background: var(--card);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
}
.timeline-item-time {
  font-size: 12px;
  color: var(--text-3);
  margin-bottom: 2px;
}
.timeline-item-label {
  font-size: 14px;
  font-weight: 500;
}
.timeline-item-amount {
  font-size: 16px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.timeline-diff {
  font-size: 11px;
  text-align: right;
  margin-top: 2px;
}
.timeline-diff.up { color: var(--green); }
.timeline-diff.down { color: var(--red); }
.timeline-diff.flat { color: var(--text-3); }

/* 空状态 */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-3);
}
.empty-state .icon {
  font-size: 48px;
  margin-bottom: 12px;
  opacity: 0.4;
}
.empty-state .title {
  font-size: 16px;
  font-weight: 500;
  margin-bottom: 4px;
  color: var(--text-2);
}
.empty-state .desc {
  font-size: 13px;
}

/* ===== 底部导航 ===== */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  background: var(--nav-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 0.5px solid var(--border);
  display: flex;
  justify-content: space-around;
  padding: 8px 0 24px;
  z-index: 90;
}
.nav-item {
  flex: 1;
  background: none;
  border: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;   /* 垂直居中 */
  gap: 2px;
  color: var(--text-3);        /* 非选中：更浅的灰色 */
  font-size: 10px;         /* 非选中：稍小字号 */
  cursor: pointer;
  padding: 6px 0;
  transition: color 0.2s, opacity 0.2s;
  opacity: 0.65;           /* 非选中：降低不透明度 */
  min-width: 0;            /* 防止内容撑开 */
}
/* 选中态：彩色 + 加粗 + 图标也上色（不再放大） */
.nav-item.active {
  color: var(--primary);
  font-weight: 700;
  font-size: 11px;
  opacity: 1;
}
/* 图标固定尺寸容器，确保4个tab图标一样大 */
.nav-item .nav-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  font-size: 18px;
  line-height: 1;
  overflow: hidden;
}
/* 非选中图标去色 */
.nav-item:not(.active) .nav-icon {
  filter: grayscale(0.7) opacity(0.5);
}

/* FAB */
.fab {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary);
  color: white;
  border: none;
  font-size: 28px;
  box-shadow: 0 4px 16px rgba(99,102,241,0.4);
  z-index: 95;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s;
}
.fab:active { transform: translateX(-50%) scale(0.9); }

/* ===== 弹层 ===== */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 200;
  display: none;
  opacity: 0;
  transition: opacity 0.25s;
}
.overlay.show {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 1;
}
.sheet {
  background: var(--card);
  width: 100%;
  max-width: 430px;
  border-radius: 20px 20px 0 0;
  padding: 20px 20px 16px;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.22,0.61,0.36,1);
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  overflow: hidden; /* 由内部 sheet-body 接管滚动 */
}
.sheet-body {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  margin: 0 -4px;
  padding: 0 4px;
}
.sheet-body::-webkit-scrollbar { width: 4px; }
.sheet-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* 底部固定按钮栏（项目详情页专用） */
.sheet-actions {
  flex-shrink: 0;
  display: flex;
  gap: 8px;
  padding: 12px 0 4px;
  border-top: 0.5px solid var(--border);
  margin-top: 8px;
  background: var(--card);
}
.sheet-actions .btn-primary,
.sheet-actions .btn-secondary,
.sheet-actions .btn-danger {
  flex: 1;
  margin: 0;
  padding: 12px 4px;
  font-size: 14px;
  white-space: nowrap;
  border-radius: 12px;
}
.sheet-actions .btn-danger {
  background: #fef2f2;
  color: var(--red);
  font-weight: 500;
}
.overlay.show .sheet { transform: translateY(0); }
.sheet-handle {
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: var(--text-3);
  margin: 0 auto 16px;
  opacity: 0.4;
}
.sheet-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 20px;
  text-align: center;
}

/* 表单 */
.form-group { margin-bottom: 16px; }
.form-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 6px;
  display: block;
}
.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-size: 16px;
  font-family: inherit;
  background: var(--card);
  color: var(--text);
  transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--primary);
}
.form-input.amount-input {
  font-size: 24px;
  font-weight: 700;
  text-align: center;
  letter-spacing: -0.5px;
}
.color-picker {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 8px;
  padding: 0;
}
.color-option {
  aspect-ratio: 1 / 1;
  width: 100%;
  max-width: 36px;
  justify-self: center;
  border-radius: 8px;
  border: 3px solid transparent;
  cursor: pointer;
  transition: transform 0.15s;
  box-sizing: border-box;
}
.color-option.selected {
  border-color: var(--text);
  transform: scale(1.1);
}
.btn-primary {
  width: 100%;
  padding: 14px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  transition: opacity 0.2s;
}
.btn-primary:active { opacity: 0.8; }
.btn-secondary {
  width: 100%;
  padding: 14px;
  background: var(--bg);
  color: var(--text-2);
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  margin-top: 8px;
}
.btn-danger {
  width: 100%;
  padding: 14px;
  background: #fef2f2;
  color: var(--red);
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  margin-top: 8px;
}

/* 数字键盘按钮 */
.quick-amounts {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.quick-amount {
  padding: 6px 12px;
  border-radius: 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  font-size: 13px;
  color: var(--text-2);
  cursor: pointer;
}

/* Toast */
.toast {
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: rgba(0,0,0,0.8);
  color: white;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 14px;
  z-index: 300;
  transition: transform 0.3s;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* 列表项 */
.list-item {
  background: var(--card);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}
.list-item:active { background: var(--bg); }
.list-item-info { flex: 1; }
.list-item-title {
  font-size: 15px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
.list-item-sub {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 2px;
}
.list-item-value {
  font-size: 16px;
  font-weight: 700;
  text-align: right;
}
.list-item-meta {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 2px;
}

.section-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-2);
  margin: 20px 0 10px;
  padding-left: 4px;
}

.summary-row {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
}
.summary-box {
  flex: 1;
  background: var(--card);
  border-radius: 12px;
  padding: 14px;
  box-shadow: var(--shadow);
}
.summary-box-label {
  font-size: 11px;
  color: var(--text-3);
  margin-bottom: 4px;
}
.summary-box-value {
  font-size: 18px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.summary-box-value.green { color: var(--green); }
.summary-box-value.red { color: var(--red); }
.summary-box-meta { font-size: 12px; margin-top: 3px; font-variant-numeric: tabular-nums; }
.summary-box-meta.green { color: var(--green); }
.summary-box-meta.red { color: var(--red); }

/* 统计页顶部汇总卡：第一行总金额 + 第二行左右分栏对比 */
.summary-card {
  background: var(--card);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 12px;
}
.summary-total { padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.summary-total-label { font-size: 12px; color: var(--text-3); margin-bottom: 4px; }
.summary-total-value {
  font-size: 32px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--text-1);
  letter-spacing: -0.5px;
}
.summary-total-meta { font-size: 12px; color: var(--text-3); margin-top: 4px; }
.summary-halves { display: flex; align-items: stretch; padding-top: 14px; }
.summary-half { flex: 1; min-width: 0; }
.summary-half-divider { width: 1px; background: var(--border); margin: 2px 14px; flex-shrink: 0; }

/* 总目标横幅 */
.goal-banner {
  background: var(--card);
  border-radius: 14px;
  margin: 12px 0 0;
  box-shadow: var(--shadow);
  cursor: pointer;
  overflow: hidden;
}
.goal-banner-inner { padding: 14px 16px; }
.goal-banner-empty {
  padding: 14px 16px;
  text-align: center;
  color: var(--text-3);
  font-size: 14px;
}
.goal-banner-top {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--text-2);
  margin-bottom: 8px;
}
.goal-banner-top .pct { font-weight: 700; color: var(--primary); }
.goal-banner-bottom {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 8px;
}
.goal-banner-bottom.done { color: var(--green); font-weight: 600; }

/* 快照页日期选择 */
.snapshot-date-wrap {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
/* 日期输入框：避免 iOS Safari 原生日历图标溢出 */
.snapshot-date-wrap input[type="date"] {
  -webkit-appearance: none;
  appearance: none;
  position: relative;
  padding-right: 40px; /* 给日历图标留位 */
  min-height: 46px;
}
.snapshot-date-wrap input[type="date"]::-webkit-calendar-picker-indicator {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  opacity: 0.55;
  cursor: pointer;
  width: 22px;
  height: 22px;
}
/* 桌面端浏览器（Chrome/Edge/Firefox）下的同款样式，保持一致 */
.snapshot-date-wrap input[type="date"]::-webkit-inner-spin-button,
.snapshot-date-wrap input[type="date"]::-webkit-clear-button {
  display: none;
}
.snapshot-summary {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  border-radius: var(--radius);
  padding: 20px;
  color: white;
  margin-bottom: 12px;
  box-shadow: 0 4px 20px rgba(99,102,241,0.3);
}
.snapshot-summary .sl { font-size: 13px; opacity: 0.85; margin-bottom: 6px; }
.snapshot-summary .sa {
  font-size: 30px; font-weight: 800; letter-spacing: -1px;
  font-variant-numeric: tabular-nums;
}
.snapshot-summary .sa .currency { font-size: 16px; font-weight: 600; margin-right: 4px; opacity: 0.9; }
.snapshot-summary .sd { font-size: 12px; opacity: 0.85; margin-top: 6px; }

/* 股权激励页 */
.page-head { padding: 16px 16px 4px; }
.page-title { font-size: 20px; font-weight: 700; color: #1d1d1f; }
.page-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.sub-tabs { display: flex; gap: 8px; padding: 10px 16px 4px; }
.sub-tab { flex: 1; text-align: center; padding: 8px 0; font-size: 13px; color: var(--text-2); background: var(--bg); border-radius: 10px; cursor: pointer; }
.sub-tab.active { color: #fff; background: var(--primary); font-weight: 600; }

/* 股权激励表单：修复 sheet-body 负margin 导致标签截断 */
.sheet-body.eq-form { margin: 0; padding: 0; }
.sheet-body.eq-form .form-group { padding: 0 4px; }
/* 统一所有输入框宽度，强制约束 */
.sheet-body.eq-form .form-group input,
.sheet-body.eq-form .form-group select,
.sheet-body.eq-form .form-group textarea {
  width: 100%;
  min-width: 0;
  max-width: 100%;
  box-sizing: border-box;
}
/* date input 终极修复：隐藏 iOS 原生日历图标，让宽度与其它框完全一致 */
.sheet-body.eq-form input[type="date"].form-input {
  appearance: none;
  -webkit-appearance: none;
  width: 100% !important;
  min-width: 0 !important;
  max-width: 100% !important;
  box-sizing: border-box !important;
}
.sheet-body.eq-form input[type="date"].form-input::-webkit-calendar-picker-indicator {
  display: none;          /* 隐藏日历图标（iOS 点击框仍弹出日期选择器）*/
}
.sheet-body.eq-form input[type="date"].form-input::-webkit-inner-spin-button,
.sheet-body.eq-form input[type="date"].form-input::-webkit-clear-button,
.sheet-body.eq-form input[type="date"].form-input::-webkit-datetime-edit-text,
.sheet-body.eq-form input[type="date"].form-input::-webkit-datetime-edit-month-field,
.sheet-body.eq-form input[type="date"].form-input::-webkit-datetime-edit-day-field,
.sheet-body.eq-form input[type="date"].form-input::-webkit-datetime-edit-year-field {
  /* 保持原生日期文本显示不变 */
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="app-title">我的钱包</div>
    <div class="header-actions">
      <button class="icon-btn hidden-btn" id="themeToggle" onclick="toggleTheme()" title="切换深浅色">🌙</button>
      <button class="icon-btn hidden-btn" onclick="showSearchSheet()" title="搜索记录">🔍</button>
      <button class="icon-btn" id="amountToggle" onclick="toggleAmountVisibility()" title="隐藏/显示金额"></button>
      <button class="icon-btn" onclick="exportData()" title="导出备份">↓</button>
      <button class="icon-btn" onclick="importData()" title="导入备份">↑</button>
      <button class="icon-btn" onclick="onHeaderAddClick()" title="新增">＋</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="handleImportFile(this)">
  </div>
  <div class="total-card">
    <div class="total-label">总存款</div>
    <div class="total-amount"><span class="currency" id="totalCurrency">¥</span><span id="totalAmount">0</span></div>
    <div class="total-meta">
      <span id="totalChange">—</span>
      <span id="totalDate">—</span>
    </div>
  </div>
  <div class="goal-banner" id="goalBanner"></div>
</div>

<div class="tabs" id="tabs"></div>

<div class="content" id="content"></div>

<button class="fab" onclick="onFabClick()">＋</button>

<nav class="bottom-nav">
  <button class="nav-item active" data-page="home" onclick="switchPage('home')">
    <span class="nav-icon">💼</span><span>项目</span>
  </button>
  <button class="nav-item" data-page="snapshot" onclick="switchPage('snapshot')">
    <span class="nav-icon">📅</span><span>快照</span>
  </button>
  <button class="nav-item" data-page="stats" onclick="switchPage('stats')">
    <span class="nav-icon">📊</span><span>统计</span>
  </button>
  <button class="nav-item" data-page="equity" onclick="switchPage('equity')">
    <span class="nav-icon">📈</span><span>中长期激励</span>
  </button>
</nav>

<!-- 弹层 -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 数据层 =====
const STORAGE_KEY = 'deposit_tracker_v1';
// 8 色一行排满：移除红、灰（与其他色相冲/不直观）
const COLORS = ['#6366f1','#34c759','#ff9500','#af52de','#00c7be','#ff2d55','#5ac8fa','#ffcc00'];

let state = {
  projects: [],
  records: [],
  goal: 0,
  activeTab: 'all',
  snapshotDate: null,
  equity: [],   // 股权激励：[{id,name,color,totalAmount,grantPrice,totalShares,grantDate,vestYears,vestBatches,vestStartYear,createdAt,vests:[{id,date,amount,shares,note}]}]
  equityView: 'project',  // 'project' 按项目查看 / 'time' 按解禁时间查看
  currentPrice: 19,       // 现行股价（用于估算股权预计金额），默认19，可修改
  currency: '¥',          // 显示币种符号（默认人民币）
};

// 获取现行股价（兼容旧数据：空/0 时回退默认19）
function getCurrentPrice() {
  return Number(state.currentPrice) > 0 ? Number(state.currentPrice) : 19;
}

// 支持的币种符号（key 用于持久化校验）
const VALID_CURRENCIES = { '¥': '人民币 ¥', '$': '美元 $', '€': '欧元 €', '£': '英镑 £', '₩': '韩元 ₩', '฿': '泰铢 ฿', '₹': '印度卢比 ₹', '元': '自定义 元' };
function CUR() { return state.currency || '¥'; }

// ===== 主题（深色/浅色）=====
let theme = localStorage.getItem('dw_theme') ||
  (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

function applyTheme() {
  document.documentElement.dataset.theme = theme;
  const tb = document.getElementById('themeToggle');
  if (tb) tb.textContent = theme === 'dark' ? '☀️' : '🌙';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f1115' : '#6366f1');
}
function toggleTheme() {
  theme = theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('dw_theme', theme);
  applyTheme();
  render();
  toast(theme === 'dark' ? '已切换到深色模式' : '已切换到浅色模式');
}
// 读取当前主题下的 CSS 变量（供 SVG 图表配色使用）
function cssVar(name, fallback) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
}
let currentPage = 'home';

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try {
      const data = JSON.parse(raw);
      state.projects = data.projects || [];
      state.records = data.records || [];
      state.goal = data.goal || 0;
      state.equity = Array.isArray(data.equity) ? data.equity : [];
      state.currentPrice = Number(data.currentPrice) > 0 ? Number(data.currentPrice) : 19;
      state.currency = VALID_CURRENCIES[data.currency] ? data.currency : '¥';
      // 如果存储的数据是空的（被清空过），重新生成演示数据
      if (state.projects.length === 0 && state.records.length === 0 && (state.equity||[]).length === 0) {
        seedDemo();
      }
    } catch(e) { seedDemo(); }
  } else {
    seedDemo();
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    projects: state.projects,
    records: state.records,
    goal: state.goal || 0,
    equity: state.equity,
    currentPrice: state.currentPrice || 19,
    currency: state.currency || '¥'
  }));
}

function seedDemo() {
  const now = new Date();
  const d = (days) => {
    const x = new Date(now);
    x.setDate(x.getDate() - days);
    return x.toISOString();
  };
  state.projects = [
    { id: 'p1', name: '工商银行', color: '#6366f1', createdAt: d(60) },
    { id: 'p2', name: '支付宝理财', color: '#34c759', createdAt: d(60) },
    { id: 'p3', name: '现金', color: '#ff9500', createdAt: d(60) }
  ];
  state.goal = 200000;
  state.records = [
    { id: 'r1', projectId: 'p1', amount: 50000, date: d(50), note: '初始' },
    { id: 'r2', projectId: 'p1', amount: 55000, date: d(40), note: '工资' },
    { id: 'r3', projectId: 'p1', amount: 62000, date: d(25), note: '' },
    { id: 'r4', projectId: 'p1', amount: 68000, date: d(10), note: '奖金' },
    { id: 'r5', projectId: 'p2', amount: 20000, date: d(45), note: '买入' },
    { id: 'r6', projectId: 'p2', amount: 24000, date: d(30), note: '' },
    { id: 'r7', projectId: 'p2', amount: 28500, date: d(15), note: '收益' },
    { id: 'r8', projectId: 'p2', amount: 31000, date: d(3), note: '' },
    { id: 'r9', projectId: 'p3', amount: 8000, date: d(40), note: '' },
    { id: 'r10', projectId: 'p3', amount: 12000, date: d(20), note: '' },
    { id: 'r11', projectId: 'p3', amount: 10000, date: d(5), note: '开销' }
  ];
  state.equity = [
    { id: 'e1', name: '2024年限制性股票', color: '#af52de', totalAmount: 500000, grantPrice: 10, totalShares: 50000,
      grantDate: d(100).slice(0,10), vestBatches: 5,
      vestStartYear: 1, vestFirstMonth: 9,
      vestRestStartYear: 3, vestRestMonth: 2, vestRestInterval: 1,
      createdAt: d(100),
      vests: [ { id: 'v1', date: d(20), amount: 100000, shares: 10000, note: '首批解禁' } ] }
  ];
  saveData();
}

// ===== 工具 =====
function fmtMoney(n) {
  if (amountHidden) return '****';
  return Number(n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDate(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}月${d.getDate()}日`;
}
function fmtDateFull(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtTime(iso) {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function fmtDateInput(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDateGroup(iso) {
  const d = new Date(iso);
  const today = new Date();
  const diff = Math.floor((today - d) / 86400000);
  if (diff === 0) return '今天';
  if (diff === 1) return '昨天';
  if (diff < 7) return `${diff}天前`;
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function getProjectRecords(pid) {
  return state.records
    .filter(r => r.projectId === pid)
    .sort((a,b) => new Date(a.date) - new Date(b.date));
}
function getLatestRecord(pid) {
  const recs = getProjectRecords(pid);
  return recs.length ? recs[recs.length - 1] : null;
}
function getPrevRecord(pid, beforeIso) {
  const recs = getProjectRecords(pid).filter(r => new Date(r.date) < new Date(beforeIso));
  return recs.length ? recs[recs.length - 1] : null;
}
function getTotalLatest() {
  let total = 0;
  let latestDate = null;
  let prevTotal = 0;
  let hasPrev = false;
  state.projects.forEach(p => {
    const latest = getLatestRecord(p.id);
    if (latest) {
      total += latest.amount;
      if (!latestDate || new Date(latest.date) > new Date(latestDate)) latestDate = latest.date;
      const prev = getPrevRecord(p.id, latest.date);
      if (prev) { prevTotal += prev.amount; hasPrev = true; }
    }
  });
  return { total, latestDate, prevTotal: hasPrev ? prevTotal : null };
}

// 计算截止某日期（含当天）的总存款快照；项目在该日期尚未有记录则按 0 计
function getTotalAtDate(dateStr) {
  if (!dateStr) return null;
  const parts = dateStr.split('-');
  const cutoff = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 23, 59, 59).getTime();
  let total = 0;
  let has = false;
  state.projects.forEach(p => {
    const recs = getProjectRecords(p.id).filter(r => new Date(r.date).getTime() <= cutoff);
    if (recs.length) { total += recs[recs.length - 1].amount; has = true; }
  });
  return has ? total : null;
}

// 上个月最后一天（YYYY-MM-DD）
function getLastMonthEndStr() {
  const now = new Date();
  const lastOfPrev = new Date(now.getFullYear(), now.getMonth(), 0); // 本月第0天 = 上月末
  return `${lastOfPrev.getFullYear()}-${String(lastOfPrev.getMonth() + 1).padStart(2, '0')}-${String(lastOfPrev.getDate()).padStart(2, '0')}`;
}
// 今年 1 月 1 日（YYYY-MM-DD）
function getYearStartStr() {
  const now = new Date();
  return `${now.getFullYear()}-01-01`;
}

// ===== 渲染 =====
function render() {
  renderTabs();
  renderPage();
  renderGoalBanner();
}

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  let html = `<div class="tab ${state.activeTab==='all'?'active':''}" onclick="setTab('all')">全部</div>`;
  state.projects.forEach(p => {
    html += `<div class="tab ${state.activeTab===p.id?'active':''}" onclick="setTab('${p.id}')">
      <span class="dot" style="background:${p.color}"></span>${p.name}
    </div>`;
  });
  tabsEl.innerHTML = html;
}

function setTab(pid) {
  state.activeTab = pid;
  render();
}

function renderPage() {
  const isHome = currentPage === 'home';
  const tc = document.querySelector('.total-card');
  const gb = document.getElementById('goalBanner');
  const tabsEl = document.getElementById('tabs');
  if (tc) tc.style.display = isHome ? '' : 'none';
  if (gb) gb.style.display = isHome ? '' : 'none';
  if (tabsEl) tabsEl.style.display = currentPage === 'equity' ? 'none' : '';
  if (currentPage === 'home') renderHome();
  else if (currentPage === 'snapshot') renderSnapshot();
  else if (currentPage === 'stats') renderStats();
  else if (currentPage === 'equity') renderEquity();
  renderTotal();
  renderGoalBanner();
}

function renderTotal() {
  const { total, latestDate, prevTotal } = getTotalLatest();
  document.getElementById('totalAmount').textContent = fmtMoney(total);
  const curEl = document.getElementById('totalCurrency');
  if (curEl) curEl.textContent = CUR();
  const changeEl = document.getElementById('totalChange');
  const dateEl = document.getElementById('totalDate');
  if (prevTotal !== null) {
    const diff = total - prevTotal;
    const pct = prevTotal ? (diff / prevTotal * 100).toFixed(1) : 0;
    if (diff > 0) {
      changeEl.innerHTML = `<span class="change-up">↑ ${CUR()}${fmtMoney(diff)} (+${pct}%)</span>`;
    } else if (diff < 0) {
      changeEl.innerHTML = `<span class="change-down">↓ ${CUR()}${fmtMoney(Math.abs(diff))} (${pct}%)</span>`;
    } else {
      changeEl.innerHTML = `<span>持平</span>`;
    }
  } else {
    changeEl.textContent = '暂无对比';
  }
  dateEl.textContent = latestDate ? `更新于 ${fmtDate(latestDate)}` : '暂无记录';
}

function renderHome() {
  const content = document.getElementById('content');
  let projects = state.activeTab === 'all' ? state.projects : state.projects.filter(p => p.id === state.activeTab);
  
  if (projects.length === 0) {
    content.innerHTML = `<div class="empty-state">
      <div class="icon">📔</div>
      <div class="title">还没有项目</div>
      <div class="desc">点击右上角"＋"创建第一个存款项目</div>
    </div>`;
    return;
  }

  let html = '';
  projects.forEach(p => {
    const recs = getProjectRecords(p.id);
    const latest = recs.length ? recs[recs.length-1] : null;
    const prev = latest ? getPrevRecord(p.id, latest.date) : null;
    let changeHtml = '<div class="project-change flat">暂无数据</div>';
    if (latest && prev) {
      const diff = latest.amount - prev.amount;
      const pct = prev.amount ? (diff/prev.amount*100).toFixed(1) : 0;
      if (diff > 0) changeHtml = `<div class="project-change up">↑ ${CUR()}${fmtMoney(diff)} (+${pct}%)</div>`;
      else if (diff < 0) changeHtml = `<div class="project-change down">↓ ${CUR()}${fmtMoney(Math.abs(diff))} (${pct}%)</div>`;
      else changeHtml = `<div class="project-change flat">— 持平</div>`;
    } else if (latest) {
      changeHtml = `<div class="project-change flat">初始记录</div>`;
    }
    const latestAmount = latest ? latest.amount : 0;

    html += `<div class="project-card" onclick="showProjectDetail('${p.id}')">
      <div class="project-header">
        <div class="project-info">
          <div class="project-name"><span class="project-color" style="background:${p.color}"></span>${p.name}</div>
          <div class="project-latest">${CUR()}${fmtMoney(latestAmount)}</div>
          ${changeHtml}
        </div>
        <div class="project-actions" onclick="event.stopPropagation()">
          <button class="mini-btn" onclick="showAddRecordSheet('${p.id}')" title="记一笔">＋</button>
          <button class="mini-btn" onclick="showProjectDetail('${p.id}')" title="详情">›</button>
        </div>
      </div>
    </div>`;
  });
  content.innerHTML = html;
}

// 取某日期（含当天）各项目余额快照
function getSnapshotAtDate(dateStr) {
  // dateStr: YYYY-MM-DD，截止当天 23:59:59
  const parts = dateStr.split('-');
  const cutoff = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 23, 59, 59).getTime();
  const items = [];
  let total = 0;
  state.projects.forEach(p => {
    const recs = getProjectRecords(p.id).filter(r => new Date(r.date).getTime() <= cutoff);
    if (recs.length) {
      const latest = recs[recs.length - 1];
      items.push({ project: p, amount: latest.amount, record: latest });
      total += latest.amount;
    } else {
      items.push({ project: p, amount: null, record: null });
    }
  });
  return { items, total };
}

function renderSnapshot() {
  const content = document.getElementById('content');
  const todayStr = fmtDateInput(new Date());
  const selected = state.snapshotDate || todayStr;
  const snap = getSnapshotAtDate(selected);

  // 按顶部 tab 筛选（与首页/统计页一致）
  let items = snap.items;
  let activeProj = null;
  if (state.activeTab !== 'all') {
    activeProj = state.projects.find(p => p.id === state.activeTab) || null;
    items = items.filter(i => i.project.id === state.activeTab);
  }
  const snapTotal = items.reduce((s, i) => s + (i.amount || 0), 0);
  const dayHasAny = items.some(i => i.record !== null);
  const summaryTitle = activeProj ? `${selected} ${activeProj.name} 存款快照` : `${selected} 总存款快照`;

  let html = `<div class="snapshot-date-wrap">
    <label class="form-label">选择日期，查看当天各项目存款</label>
    <input type="date" class="form-input" id="snapshotDate" value="${selected}" max="${todayStr}" onchange="onSnapshotDateChange(this.value)">
  </div>`;

  // 合计卡
  html += `<div class="snapshot-summary">
    <div class="sl">${summaryTitle}</div>
    <div class="sa"><span class="currency">${CUR()}</span>${fmtMoney(snapTotal)}</div>
    <div class="sd">${dayHasAny ? '该日及之前最后一次记录合计' : '该日期暂无记录'}</div>
  </div>`;

  if (!dayHasAny) {
    html += `<div class="empty-state">
      <div class="icon">📅</div>
      <div class="title">${selected} 没有存款记录</div>
      <div class="desc">在此之前还没有任何记录，试试选择更晚的日期</div>
    </div>`;
    content.innerHTML = html;
    return;
  }

  // 各项目快照
  items.forEach(item => {
    const hasRec = item.record !== null;
    const amountTxt = hasRec ? `${CUR()}${fmtMoney(item.amount)}` : '暂无记录';
    const noteTxt = hasRec && item.record.note ? `<div class="project-change flat">备注：${item.record.note}</div>` : '';
    html += `<div class="project-card" onclick="${hasRec ? `editRecord('${item.record.id}')` : ''}">
      <div class="project-header">
        <div class="project-info">
          <div class="project-name"><span class="project-color" style="background:${item.project.color}"></span>${item.project.name}</div>
          <div class="project-latest">${amountTxt}</div>
          ${noteTxt}
        </div>
        ${hasRec ? `<div class="project-actions" onclick="event.stopPropagation()">
          <button class="mini-btn" onclick="editRecord('${item.record.id}')" title="编辑">›</button>
        </div>` : ''}
      </div>
    </div>`;
  });

  content.innerHTML = html;
}

function onSnapshotDateChange(val) {
  state.snapshotDate = val;
  renderSnapshot();
}

function renderStats() {
  const content = document.getElementById('content');
  let projects = state.activeTab === 'all' ? state.projects : state.projects.filter(p => p.id === state.activeTab);
  
  if (projects.length === 0 || state.records.length === 0) {
    content.innerHTML = `<div class="empty-state">
      <div class="icon">📊</div>
      <div class="title">暂无统计数据</div>
      <div class="desc">添加记录后可查看趋势分析</div>
    </div>`;
    return;
  }

  // 计算各项目最新值
  const totals = projects.map(p => {
    const latest = getLatestRecord(p.id);
    return { project: p, amount: latest ? latest.amount : 0 };
  });
  const grandTotal = totals.reduce((s,t) => s + t.amount, 0);

  // 较上月：本月总额相比上月末总额
  const prevTotal = getTotalAtDate(getLastMonthEndStr());
  let totalDiff = 0, totalPct = 0;
  if (prevTotal !== null && prevTotal > 0) {
    totalDiff = grandTotal - prevTotal;
    totalPct = prevTotal ? totalDiff / prevTotal * 100 : 0;
  }

  // 较年初：本月总额相比今年 1 月 1 日总额
  const yearStartTotal = getTotalAtDate(getYearStartStr());
  let yearDiff = 0, yearPct = 0;
  if (yearStartTotal !== null && yearStartTotal > 0) {
    yearDiff = grandTotal - yearStartTotal;
    yearPct = yearStartTotal ? yearDiff / yearStartTotal * 100 : 0;
  }

  // 基准期标签（用于标题说明）
  const nowD = new Date();
  const lastMonthMB = new Date(nowD.getFullYear(), nowD.getMonth(), 0); // 上月末，用于取月份
  const lastMonthLabel = `${lastMonthMB.getFullYear()}年${lastMonthMB.getMonth() + 1}月`;
  const yearLabel = `${nowD.getFullYear()}年`;
  const monthStartLabel = `${nowD.getFullYear()}年${nowD.getMonth() + 1}月`;

  // 总目标进度卡（始终显示，点击卡片即可设置/修改，不再单独一行按钮）
  const { total: goalTotal } = getTotalLatest();
  let goalCard = '';
  if (state.goal > 0) {
    const pct = Math.min(100, goalTotal / state.goal * 100);
    const remain = state.goal - goalTotal;
    const done = remain <= 0;
    goalCard = `<div class="chart-card goal-card" style="margin-bottom:12px;cursor:pointer;" onclick="showSetGoalSheet()">
      <div class="chart-title">总目标进度</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);margin-bottom:8px;">
        <span>目标 ${CUR()}${fmtMoney(state.goal)}</span>
        <span style="font-weight:700;color:var(--primary)">${pct.toFixed(1)}%</span>
      </div>
      <div class="goal-bar-track"><div class="goal-bar-fill" style="width:${pct}%"></div></div>
      <div style="font-size:12px;color:${done?'var(--green)':'var(--text-3)'};margin-top:8px;${done?'font-weight:600':''}">${done?'🎉 已达成总存款目标！':'还差 '+CUR()+fmtMoney(remain)+' 达成'} · 点击修改</div>
    </div>`;
  } else {
    goalCard = `<div class="chart-card goal-card" style="margin-bottom:12px;cursor:pointer;text-align:center;color:var(--primary);" onclick="showSetGoalSheet()">
      <div class="chart-title">总存款目标</div>
      <div style="font-size:13px;padding:10px 0 2px;">＋ 点击设置总存款目标</div>
    </div>`;
  }

  let html = `${goalCard}

    <div class="summary-card">
      <!-- 第一行：总金额（独占整行） -->
      <div class="summary-total">
        <div class="summary-total-label">当前总额</div>
        <div class="summary-total-value">${CUR()}${fmtMoney(grandTotal)}</div>
        <div class="summary-total-meta">截至 ${monthStartLabel}</div>
      </div>
      <!-- 第二行：左半较上月，右半较年初 -->
      <div class="summary-halves">
        <div class="summary-half">
          <div class="summary-box-label" style="line-height:1.3;">较上月<br><span style="color:var(--text-3);font-weight:400;">${lastMonthLabel}末</span></div>
          <div class="summary-box-value ${totalDiff>0?'green':totalDiff<0?'red':''}" style="font-size:16px;">${totalDiff>0?'↑':totalDiff<0?'↓':'—'} ${totalDiff!==0?CUR()+fmtMoney(Math.abs(totalDiff)):'—'}</div>
          <div class="summary-box-meta ${totalPct>0?'green':totalPct<0?'red':''}">${totalPct>0?'+':''}${totalPct.toFixed(1)}%</div>
        </div>
        <div class="summary-half-divider"></div>
        <div class="summary-half">
          <div class="summary-box-label" style="line-height:1.3;">较年初<br><span style="color:var(--text-3);font-weight:400;">${yearLabel}1月1日</span></div>
          <div class="summary-box-value ${yearDiff>0?'green':yearDiff<0?'red':''}" style="font-size:16px;">${yearStartTotal !== null ? (yearDiff>0?'↑':yearDiff<0?'↓':'—') + ' ' + (yearDiff!==0?CUR()+fmtMoney(Math.abs(yearDiff)):'—') : '—'}</div>
          <div class="summary-box-meta ${yearPct>0?'green':yearPct<0?'red':''}">${yearStartTotal !== null ? (yearPct>0?'+':'') + yearPct.toFixed(1) + '%' : '无数据'}</div>
        </div>
      </div>
    </div>
  `;

  // 趋势图 - 合并所有项目按时间
  const activeProj = state.activeTab === 'all' ? null : state.projects.find(p => p.id === state.activeTab);
  const trendTitle = activeProj ? `${activeProj.name}存款趋势` : '总存款趋势';
  html += `<div class="chart-card">
    <div class="chart-title">${trendTitle}</div>
    <div id="trendChart"></div>
  </div>`;

  // 各项目占比饼图
  html += `<div class="chart-card">
    <div class="chart-title">项目占比</div>
    <div id="pieChart"></div>
  </div>`;

  // 各项目明细
  html += `<div class="section-title">项目明细</div>`;
  totals.sort((a,b) => b.amount - a.amount).forEach(t => {
    const pct = grandTotal ? t.amount/grandTotal*100 : 0;
    const recs = getProjectRecords(t.project.id);
    const latest = recs.length ? recs[recs.length-1] : null;
    const prev = latest ? getPrevRecord(t.project.id, latest.date) : null;
    let diffTxt = '—';
    let diffCls = '';
    if (latest && prev) {
      const d = latest.amount - prev.amount;
      if (d > 0) { diffTxt = `↑${CUR()}${fmtMoney(d)}`; diffCls = 'green'; }
      else if (d < 0) { diffTxt = `↓${CUR()}${fmtMoney(Math.abs(d))}`; diffCls = 'red'; }
      else diffTxt = '持平';
    }
    html += `<div class="list-item" onclick="showProjectDetail('${t.project.id}')">
      <div class="list-item-info">
        <div class="list-item-title"><span class="project-color" style="background:${t.project.color}"></span>${t.project.name}</div>
        <div class="list-item-sub">${recs.length}条记录 · 占比${pct.toFixed(1)}%</div>
      </div>
      <div>
        <div class="list-item-value">${CUR()}${fmtMoney(t.amount)}</div>
        <div class="list-item-meta ${diffCls}">${diffTxt}</div>
      </div>
    </div>`;
  });

  content.innerHTML = html;

  // 绘制图表
  drawTrendChart();
  drawPieChart(totals, grandTotal);
}

function drawTrendChart() {
  const container = document.getElementById('trendChart');
  if (!container) return;

  let projects = state.activeTab === 'all' ? state.projects : state.projects.filter(p => p.id === state.activeTab);
  const allDates = [...new Set(state.records.filter(r => state.activeTab==='all' || r.projectId===state.activeTab).map(r => fmtDateFull(r.date)))].sort();

  if (allDates.length === 0) { container.innerHTML = '<div style="text-align:center;color:var(--text-3);padding:20px;font-size:13px">暂无数据</div>'; return; }

  // 对每个日期，计算该日期及之前每个项目的最新值之和
  const points = allDates.map(d => {
    const dTime = new Date(d).getTime() + 86400000;
    let total = 0;
    projects.forEach(p => {
      const recs = getProjectRecords(p.id).filter(r => new Date(r.date).getTime() < dTime);
      if (recs.length) total += recs[recs.length-1].amount;
    });
    return { date: d, total };
  });

  // 限制最近30个点
  const showPoints = points.slice(-30);
  const grid = cssVar('--chart-grid', '#f0f0f0');
  const txtC = cssVar('--chart-text', '#aeaeb2');
  const baseC = cssVar('--chart-base', '#cfcfcf');
  const w = 350, h = 180, pad = { l: 42, r: 10, t: 16, b: 28 };
  const cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
  const max = Math.max(...showPoints.map(p => p.total), 0);
  const min = Math.min(0, ...showPoints.map(p => p.total));
  const range = max - min || 1;
  const xStep = showPoints.length > 1 ? cw / (showPoints.length - 1) : 0;
  const barW = Math.max(6, Math.min(28, xStep * 0.6));
  const baseY = pad.t + ch - (0 - min) / range * ch;

  let svg = `<svg viewBox="0 0 ${w} ${h}" class="chart-svg">`;
  // Y轴网格
  const yLabels = [max, (max + min) / 2, min];
  yLabels.forEach(v => {
    const y = pad.t + ch - (v - min) / range * ch;
    svg += `<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="${grid}" stroke-width="1"/>`;
    svg += `<text x="${pad.l-5}" y="${y+3}" font-size="9" fill="${txtC}" text-anchor="end">${CUR()}${v>=10000?(v/10000).toFixed(1)+'万':Math.round(v)}</text>`;
  });
  // 0 基线
  svg += `<line x1="${pad.l}" y1="${baseY}" x2="${w-pad.r}" y2="${baseY}" stroke="${baseC}" stroke-width="1"/>`;
  // 柱体
  showPoints.forEach((p, i) => {
    const x = pad.l + i * xStep;
    const y = pad.t + ch - (p.total - min) / range * ch;
    const top = Math.min(y, baseY);
    const barH = Math.max(2, Math.abs(y - baseY));
    const fill = p.total >= 0 ? '#6366f1' : '#ff3b30';
    const rx = Math.min(3, barW / 2);
    svg += `<rect x="${(x - barW/2).toFixed(1)}" y="${top.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="${rx}" fill="${fill}"/>`;
  });
  // X轴日期
  const labelCount = Math.min(4, showPoints.length);
  for (let i = 0; i < labelCount; i++) {
    const idx = labelCount === 1 ? 0 : Math.floor(i * (showPoints.length-1) / (labelCount-1));
    const x = pad.l + idx * xStep;
    svg += `<text x="${x}" y="${h-8}" font-size="9" fill="${txtC}" text-anchor="middle">${fmtDate(showPoints[idx].date)}</text>`;
  }
  svg += `</svg>`;
  container.innerHTML = svg;
}

function drawPieChart(totals, grandTotal) {
  const container = document.getElementById('pieChart');
  if (!container || grandTotal === 0) { container.innerHTML = '<div style="text-align:center;color:var(--text-3);padding:20px;font-size:13px">暂无数据</div>'; return; }

  const t1 = cssVar('--text-1', '#1d1d1f');
  const txt2 = cssVar('--text-3', '#aeaeb2');
  const w = 320, h = 200, cx = 92, cy = 100, r = 80;
  let angle = -Math.PI / 2;
  let svg = `<svg viewBox="0 0 ${w} ${h}" class="chart-svg">`;

  totals.filter(t => t.amount > 0).forEach(t => {
    const pct = t.amount / grandTotal;
    if (pct >= 0.999) {
      // 单项占比100%时画整圆，避免弧线起止点重合画不出
      svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${t.project.color}"/>`;
      return;
    }
    const endAngle = angle + pct * Math.PI * 2;
    const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
    const x2 = cx + r * Math.cos(endAngle), y2 = cy + r * Math.sin(endAngle);
    const large = pct > 0.5 ? 1 : 0;
    svg += `<path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${t.project.color}"/>`;
    angle = endAngle;
  });

  // 图例
  svg += `<text x="200" y="18" font-size="12" font-weight="700" fill="${t1}">合计 ${CUR()}${grandTotal>=10000?(grandTotal/10000).toFixed(1)+'万':Math.round(grandTotal)}</text>`;
  let legendY = 42;
  totals.filter(t => t.amount > 0).forEach(t => {
    const pct = (t.amount/grandTotal*100).toFixed(1);
    svg += `<rect x="200" y="${legendY-9}" width="10" height="10" rx="2" fill="${t.project.color}"/>`;
    svg += `<text x="216" y="${legendY}" font-size="11" fill="${t1}">${t.project.name}</text>`;
    svg += `<text x="216" y="${legendY+13}" font-size="10" fill="${txt2}">${CUR()}${fmtMoney(t.amount)} · ${pct}%</text>`;
    legendY += 34;
  });
  svg += `</svg>`;
  container.innerHTML = svg;
}

function switchPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  // 每次切换 tab 都从最顶部开始展示

  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;

}

function handleImportFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      const projects = Array.isArray(data.projects) ? data.projects : [];
      const records = Array.isArray(data.records) ? data.records : [];
      const equity = Array.isArray(data.equity) ? data.equity : [];
      if (projects.length === 0 && records.length === 0 && equity.length === 0) {
        toast('备份文件为空或格式不正确');
        return;
      }
      if (!confirm(`导入将覆盖当前数据（${state.projects.length}个项目 / ${state.records.length}条记录 / ${(state.equity||[]).length}笔股权激励），覆盖后无法恢复。确定导入？`)) {
        input.value = '';
        return;
      }
      state.projects = projects;
      state.records = records;
      state.equity = equity;
      if (typeof data.goal === 'number') state.goal = data.goal;
      if (typeof data.activeTab === 'string') state.activeTab = data.activeTab;
      if (Number(data.currentPrice) > 0) state.currentPrice = Number(data.currentPrice);
      if (VALID_CURRENCIES[data.currency]) state.currency = data.currency;
      saveData();
      render();
      toast('备份已导入');
    } catch (err) {
      console.error('导入失败', err);
      toast('导入失败：文件不是有效的JSON备份');
    } finally {
      input.value = '';
    }
  };
  reader.onerror = () => {
    toast('读取文件失败');
    input.value = '';
  };
  reader.readAsText(file);
}

// ===== 股权激励 =====
function getEquityVested(g) {
  const vests = g.vests || [];
  const shares = vests.reduce((s, v) => s + (Number(v.shares) || 0), 0);
  const amount = vests.reduce((s, v) => s + (Number(v.amount) || 0), 0);
  return { shares, amount };
}
function getEquityRemaining(g) {
  const v = getEquityVested(g);
  return {
    shares: (Number(g.totalShares) || 0) - v.shares,
    amount: (Number(g.totalAmount) || 0) - v.amount
  };
}

// 全局固定的解禁规则：首批次年9月；后续从第2年起每年2月
const VEST_RULE = {
  firstStartYear: 1,   // 首批：授予后第1年
  firstMonth: 9,       // 首批：9月
  restStartYear: 2,    // 后续：从第2年起
  restMonth: 2,        // 后续：2月
  restInterval: 1      // 后续：每隔1年一批
};

// 根据固定规则自动生成解禁计划（预计）：每批日期/股数/预计金额
function computeVestPlan(g) {
  const batches = parseInt(g.vestBatches);
  if (!batches || batches < 1) return [];
  const total = Number(g.totalShares) || 0;
  const price = Number(g.grantPrice) || 0;
  const base = g.grantDate ? new Date(g.grantDate) : new Date();
  // 优先用授予自带规则，否则套用全局固定规则
  const firstStartYear = Number(g.vestStartYear) || VEST_RULE.firstStartYear;
  const firstMonth = Number(g.vestFirstMonth) || VEST_RULE.firstMonth;
  const restStartYear = Number(g.vestRestStartYear) || VEST_RULE.restStartYear;
  const restMonth = Number(g.vestRestMonth) || VEST_RULE.restMonth;
  const restInterval = Number(g.vestRestInterval) || VEST_RULE.restInterval;
  const perBatchShares = total / batches;
  const plan = [];
  for (let i = 1; i <= batches; i++) {
    const d = new Date(base.getFullYear(), base.getMonth(), base.getDate());
    if (i === 1) {
      // 第1批：授予后第 firstStartYear 年 + firstMonth 月
      d.setFullYear(d.getFullYear() + firstStartYear);
      d.setMonth(firstMonth - 1); // JS month is 0-based
      d.setDate(1);
    } else {
      // 第2批起：从 restStartYear 开始，每隔 restInterval 年一批，固定 restMonth 月
      const yearOffset = restStartYear + (i - 2) * restInterval;
      d.setFullYear(d.getFullYear() + yearOffset);
      d.setMonth(restMonth - 1);
      d.setDate(1);
    }
    const shares = perBatchShares;
    const amount = shares * price;
    plan.push({ batch: i, date: d.toISOString(), shares: shares, amount: amount });
  }
  return plan;
}

function renderEquity() {
  const content = document.getElementById('content');
  const list = state.equity || [];
  let html = `<div class="page-head">
    <div class="page-title">中长期激励</div>
    <div class="page-sub">记录授予与解禁，自动计算剩余股数与预计金额</div>
  </div>`;
  // 现行股价编辑条（点击修改，全站预计金额统一按此价估算）
  html += `<div onclick="showSetPriceSheet()" style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:12px;padding:10px 14px;margin:0 4px 12px;cursor:pointer;">
    <span style="font-size:13px;color:var(--text-2);">现行股价</span>
    <span style="font-size:15px;font-weight:700;color:var(--primary);">${CUR()}${fmtMoney(getCurrentPrice())} <span style="color:var(--text-3);font-weight:400;font-size:13px;">›</span></span>
  </div>`;
  // 子视图切换：按项目 / 按解禁时间
  html += `<div class="sub-tabs">
    <div class="sub-tab ${state.equityView !== 'time' ? 'active' : ''}" onclick="setEquityView('project')">按项目</div>
    <div class="sub-tab ${state.equityView === 'time' ? 'active' : ''}" onclick="setEquityView('time')">按解禁时间</div>
  </div>`;
  if (list.length === 0) {
    html += `<div class="empty-state">
      <div class="icon">📈</div>
      <div class="title">还没有中长期激励</div>
      <div class="desc">点击右下角"＋"新增一笔中长期激励</div>
    </div>`;
    content.innerHTML = html;
    return;
  }
  if (state.equityView === 'time') {
    html += renderEquityTimeView();
    content.innerHTML = html;
    return;
  }
  list.forEach(g => {
    const total = Number(g.totalShares) || 0;
    const price = getCurrentPrice();

    // 与详情页 showEquityDetail 同源：基于 plan-vest 映射计算，排除游离旧记录
    const planBatches = computeVestPlan(g);
    const vests = g.vests || [];
    const batchVests = vests.filter(v => v.batch != null);
    const looseVests = vests.filter(v => v.batch == null);
    const looseMatched = new Set();
    const matchedPlan = planBatches.map(p => {
      const exact = batchVests.find(v => v.batch === p.batch);
      let m = exact;
      if (!m && looseVests.length) {
        let best = null, bestDiff = Infinity;
        looseVests.forEach(v => {
          if (looseMatched.has(v.id)) return;
          const d = Math.abs((new Date(v.date) - new Date(p.date)) / 86400000);
          if (Math.abs((v.shares||0) - p.shares) < 1 && d <= 90 && d < bestDiff) { best = v; bestDiff = d; }
        });
        if (best) { looseMatched.add(best.id); m = best; }
      }
      return { ...p, matched: m };
    });

    const vestedShares = matchedPlan.reduce((s, m) => s + (m.matched ? (m.matched.shares||0) : 0), 0);
    const vestedAmount = matchedPlan.reduce((s, m) => s + (m.matched ? (m.matched.amount||0) : 0), 0);
    const remainShares = total - vestedShares;
    const pct = total > 0 ? Math.min(100, vestedShares / total * 100) : 0;
    const remainVal = price * remainShares;

    // 与"按解禁时间"视图一致的年份聚合卡片风格：顶部标题 + 两列汇总 + 底部详情

// 按解禁时间视图：汇总所有授予的解禁计划，按年分组
function renderEquityTimeView() {
  const list = state.equity || [];
  const all = [];
  list.forEach(g => {
    computeVestPlan(g).forEach(p => all.push({ grant: g, ...p }));
  });
  all.sort((a, b) => new Date(a.date) - new Date(b.date));
  if (all.length === 0) {
    return `<div class="empty-state">
      <div class="icon">📅</div>
      <div class="title">暂无解禁计划</div>
      <div class="desc">在新增/编辑股权激励时设置"解禁年限"与"批次"，即可自动生成解禁时间表</div>
    </div>`;
  }
  const groups = {};
  all.forEach(item => {
    const y = new Date(item.date).getFullYear();
    if (!groups[y]) groups[y] = [];
    groups[y].push(item);
  });
  const price = getCurrentPrice();
  let html = '';
  Object.keys(groups).sort().forEach(y => {
    const items = groups[y];
    const now = new Date();

    // === 先逐批计算分项实际值 + 是否已解锁（基于 vest 匹配而非仅计划日期）===
    const itemDetails = items.map(item => {
      // 尝试匹配该批次的 vest 记录（优先 batch 精确匹配，fallback 同年+股数接近）
      let matchVest = null;
      const planDateYear = new Date(item.date).getFullYear();

      // 策略1：精确 batch 匹配
      matchVest = (item.grant.vests || []).find(v => v.batch === item.batch) || null;
      // 策略2：同年+股数接近 fallback（兼容无 batch 的旧数据）
      if (!matchVest) {
        const candidates = (item.grant.vests || []).filter(v =>
          new Date(v.date).getFullYear() === planDateYear &&
          Math.abs((v.shares || 0) - item.shares) < item.shares * 0.5   // 股数偏差<50%
        );
        if (candidates.length > 0) {
          // 取股数最接近的
          candidates.sort((a, b) => Math.abs((a.shares||0)-item.shares) - Math.abs((b.shares||0)-item.shares));
          matchVest = candidates[0];
        }
      }

      const isVested = !!matchVest;   // 有匹配 vest = 已解锁（即使计划日期未到）
      const planPassed = new Date(item.date) <= now;  // 计划日期是否已到

      return {
        ...item,
        isVested,
        planPassed,
        actualShares: isVested ? (matchVest.shares || item.shares) : item.shares,
        actualAmount: isVested ? (matchVest.amount || (item.shares * price)) : (item.shares * price),
        matchVest
      };
    });

    // === 汇总：从分项实际值累加（与分项同源，保证一致）===
    const vestedItems = itemDetails.filter(d => d.isVested);
    const futureItems = itemDetails.filter(d => !d.isVested && d.planPassed === false);  // 未解锁+计划未到
    const overdueUnlocked = itemDetails.filter(d => !d.isVested && d.planPassed);     // 计划已到但无vest记录

    const vestedShares = vestedItems.reduce((s, d) => s + d.actualShares, 0);
    const vestedAmount = vestedItems.reduce((s, d) => s + d.actualAmount, 0);
    const expectShares = futureItems.reduce((s, d) => s + d.shares, 0);
    const expectAmount = expectShares * price;

    // 年份聚合卡片：两行汇总（已解禁 + 预计解禁）+ 下面分项明细
    html += `<div class="project-card" style="padding:16px;cursor:default;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div style="font-size:17px;font-weight:700;color:var(--text-1,#1d1d1f);">${y}年</div>
        <div style="font-size:13px;color:var(--text-2);">共 ${items.length} 批次</div>
      </div>
      <!-- 第一行：已解禁（实际数据，与分项之和一致）-->
      ${vestedShares > 0 ? `<div style="display:flex;gap:16px;padding-bottom:8px;border-bottom:0.5px solid var(--border);">
        <div style="flex:1;">
          <div style="font-size:11px;color:var(--green);margin-bottom:2px;">已解禁</div>
          <div style="font-size:17px;font-weight:700;color:var(--text-1,#1d1d1f);">${Math.round(vestedShares).toLocaleString('zh-CN')} 股</div>
        </div>
        <div style="flex:1;text-align:right;">
          <div style="font-size:11px;color:var(--green);margin-bottom:2px;">&nbsp;</div>
          <div style="font-size:17px;font-weight:700;color:var(--green);">${CUR()}${fmtMoney(vestedAmount)}</div>
        </div>
      </div>` : ''}
      <!-- 第二行：预计解禁（现行股价估算）-->
      ${expectShares > 0 ? `<div style="display:flex;gap:16px;padding-bottom:10px;border-bottom:0.5px solid var(--border);margin-bottom:4px;">
        <div style="flex:1;">
          <div style="font-size:11px;color:var(--text-3);margin-bottom:2px;">预计解禁</div>
          <div style="font-size:17px;font-weight:700;color:var(--text-1,#1d1d1f);">${Math.round(expectShares).toLocaleString('zh-CN')} 股</div>
        </div>
        <div style="flex:1;text-align:right;">
          <div style="font-size:11px;color:var(--text-3);margin-bottom:2px;">&nbsp;</div>
          <div style="font-size:17px;font-weight:700;color:var(--primary);">${CUR()}${fmtMoney(expectAmount)}</div>
        </div>
      </div>` : ''}`;
    // 分项明细：基于 itemDetails 渲染
    itemDetails.forEach(d => {
      // 日期显示：已解锁→实际发放日期+"已发放"；未解锁→计划日期+"解禁"
      const displayDate = d.isVested && d.matchVest ? fmtDateFull(d.matchVest.date) : fmtDate(d.date);
      const dateLabel = d.isVested ? ' 已发放' : ' 解禁';
      // 金额颜色：已解锁绿色，其他默认
      const amountColor = d.isVested ? 'var(--green)' : 'var(--text-2)';
      html += `<div onclick="showEquityDetail('${d.grant.id}')" style="cursor:pointer;display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--bg);">
        <span class="project-color" style="background:${d.grant.color};margin-top:6px;flex-shrink:0;"></span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;font-weight:600;color:var(--text-1,#1d1d1f);margin-bottom:2px;">${d.grant.name} · 第${d.batch}批</div>
          <div style="font-size:13px;color:var(--text-2);">${displayDate}${dateLabel}</div>
        </div>
        <div style="text-align:right;flex-shrink:0;">
          <div style="font-size:14px;font-weight:700;color:${d.isVested ? 'var(--green)' : 'var(--text-1,#1d1d1f)'};">${Math.round(d.actualShares).toLocaleString('zh-CN')} 股</div>
          <div style="font-size:13px;font-weight:600;color:${amountColor};">${CUR()}${fmtMoney(d.actualAmount)}</div>
        </div>
      </div>`;
    });
    html += `</div>`; // 关闭年份卡片
  });
  return html;
}

function showEquityDetail(eqId) {
  const g = (state.equity || []).find(x => x.id === eqId);
  if (!g) return;
  const total = Number(g.totalShares) || 0;
  const price = getCurrentPrice();

  // 解禁计划（自动生成）
  const plan = computeVestPlan(g);
  const vests = g.vests || [];

  // === 先做 plan-vest 映射（与下方渲染同逻辑），汇总从匹配结果计算 ===
  const batchVests = vests.filter(v => v.batch != null);
  const looseVests = vests.filter(v => v.batch == null);
  const looseMatched = new Set();
  const planMatched = plan.map(p => {
    const passed = new Date(p.date) <= new Date();
    const exact = batchVests.find(v => v.batch === p.batch);
    let matched = exact;
    if (!matched && passed && looseVests.length) {
      let best = null, bestDiff = Infinity;
      looseVests.forEach(v => {
        if (looseMatched.has(v.id)) return;
        const d = Math.abs((new Date(v.date) - new Date(p.date)) / 86400000);
        if (Math.abs((v.shares||0) - p.shares) < 1 && d <= 90 && d < bestDiff) { best = v; bestDiff = d; }
      });
      if (best) { looseMatched.add(best.id); matched = best; }
    }
    return { ...p, passed, matched };
  });

  // 汇总：只统计有 vest 匹配的批次（与下方分项一致，不受游离旧记录影响）
  const vestedShares = planMatched.reduce((s, m) => s + (m.matched ? (m.matched.shares || 0) : 0), 0);
  const vestedAmount = planMatched.reduce((s, m) => s + (m.matched ? (m.matched.amount || 0) : 0), 0);
  const remainShares = total - vestedShares;
  const pct = total > 0 ? Math.min(100, vestedShares / total * 100) : 0;
  const remainVal = price * remainShares;

  // 第一个尚未记录解锁的批次
  const firstUnlockedBatch = (planMatched.find(m => !m.matched) || {}).batch || null;

  // 渲染解禁计划
  let planHtml = '';
  if (plan.length) {
    planHtml = `<div class="section-title" style="margin:18px 0 8px;padding-left:4px;">解禁计划（${plan.length}批）</div><div style="background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:8px;">`;

    planMatched.forEach(p => {
      let displayShares = p.shares;
      let displayAmount = p.shares * price;
      let statusText = p.matched ? '已解锁' : (p.passed ? '已到期' : '未解锁');
      let statusColor = p.matched ? 'var(--green)' : (p.passed ? 'var(--orange,#f59e0b)' : 'var(--text-3)');
      let noteText = '';
      let displayDate = fmtDateFull(p.date);

      if (p.matched) {
        displayShares = p.matched.shares || p.shares;
        displayAmount = p.matched.amount != null ? p.matched.amount : displayAmount;
        statusText = '已解锁';
        statusColor = 'var(--green)';
        displayDate = fmtDateFull(p.matched.date);
        if (p.matched.note) noteText = p.matched.note;
      }

      const clickAction = `onclick="showVestSheet('${eqId}', ${p.batch}, 'detail')"`;

      planHtml += `<div style="display:flex;align-items:center;padding:12px 16px;border-bottom:0.5px solid var(--border);cursor:pointer;" ${clickAction}>
        <div style="flex:1;padding-right:10px;">
          <div style="font-size:12px;color:var(--text-3);">第${p.batch}批 · ${displayDate}</div>
          <div style="font-size:15px;font-weight:600;margin-top:3px;color:${p.matched ? 'var(--green)' : 'var(--text-1,#1d1d1f)'}">${Math.round(displayShares).toLocaleString('zh-CN')} 股 · ${CUR()}${fmtMoney(displayAmount)}</div>
          ${noteText ? `<div style="font-size:11px;color:var(--text-3);margin-top:1px;">${noteText}</div>` : ''}
        </div>
        <div style="font-size:12px;color:${statusColor};white-space:nowrap;flex-shrink:0;padding-left:6px;">${statusText}</div>
      </div>`;
    });
    planHtml += `</div>`;
  }

  openSheet(`
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
      <div style="width:18px;height:18px;border-radius:6px;background:${g.color};flex-shrink:0;"></div>
      <div class="sheet-title" style="margin:0;flex:1;">${g.name}</div>
    </div>
    <div class="sheet-body">
      <div style="background:var(--bg);border-radius:12px;padding:14px;margin:12px 0;">
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);margin-bottom:6px;">
          <span>授予总额</span><span>${CUR()}${fmtMoney(g.totalAmount)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);margin-bottom:6px;">
          <span>授予价</span><span>${CUR()}${fmtMoney(g.grantPrice)}/股</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);margin-bottom:6px;">
          <span>授予总股数</span><span>${Math.round(total).toLocaleString('zh-CN')} 股</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);margin-bottom:6px;">
          <span>已解禁</span><span>${Math.round(vestedShares).toLocaleString('zh-CN')} 股 · ${CUR()}${fmtMoney(vestedAmount)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--primary);margin-top:8px;">
          <span>剩余股数</span><span>${Math.round(remainShares).toLocaleString('zh-CN')} 股</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-top:2px;">
          <span></span><span>按现价 ${CUR()}${fmtMoney(price)} 估算 ${CUR()}${fmtMoney(remainVal)}</span>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);margin-bottom:6px;">
        <span>解禁进度</span><span>${pct.toFixed(1)}%</span>
      </div>
      <div class="goal-bar-track"><div class="goal-bar-fill" style="width:${pct}%"></div></div>
      ${planHtml}
    </div>
    <div class="sheet-actions">
      <button class="btn-primary" style="background:var(--green)" onclick="showEditEquitySheet('${eqId}')">编辑</button>
      <button class="btn-danger" onclick="deleteEquity('${eqId}')">删除</button>
      <button class="btn-secondary" onclick="closeSheet()">关闭</button>
    </div>
  `);
}

// 记解锁批次选择面板：让用户明确选择要记录解锁的批次，避免游离记录挂不上计划
