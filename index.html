  const looseVests = vests.filter(v => v.batch == null);
  const looseMatched = new Set();
  const planMatched = plan.map(p => {
    const passed = new Date(p.date) <= new Date();
    const exact = batchVests.find(v => v.batch === p.batch);
    let matched = exact;
    if (!matched && passed && looseVests.length) {
      let best = null, bestDiff = Infinity;
      looseVests.forEach(v => {
        if (looseMatched.has(v.id)) return;
        const d = Math.abs((new Date(v.date) - new Date(p.date)) / 86400000);
        if (Math.abs((v.shares||0) - p.shares) < 1 && d <= 90 && d < bestDiff) { best = v; bestDiff = d; }
      });
      if (best) { looseMatched.add(best.id); matched = best; }
    }
    return { ...p, passed, matched };
  });

  let items = '';
  if (!plan.length) {
    items = `<div style="text-align:center;color:var(--text-3);font-size:13px;padding:20px 0;">该授予未设置解禁计划，无法按批次记录</div>`;
  } else {
    planMatched.forEach(p => {
      const status = p.matched ? '已解锁' : (p.passed ? '已到期' : '未解锁');
      const statusColor = p.matched ? 'var(--green)' : (p.passed ? 'var(--orange,#f59e0b)' : 'var(--text-3)');
      const displayDate = p.matched ? fmtDateFull(p.matched.date) : fmtDateFull(p.date);
      const check = p.matched ? '✓' : '';
      items += `<div onclick="showVestSheet('${eqId}', ${p.batch}, 'picker')" style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);margin-bottom:8px;cursor:pointer;">
        <span style="font-size:14px;font-weight:700;color:var(--primary);width:52px;flex-shrink:0;">第${p.batch}批</span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:12px;color:var(--text-3);">${displayDate}</div>
          <div style="font-size:14px;font-weight:600;color:var(--text-1,#1d1d1f);margin-top:1px;">${Math.round(p.shares).toLocaleString('zh-CN')} 股</div>
        </div>
        <span style="font-size:12px;color:${statusColor};white-space:nowrap;flex-shrink:0;">${check} ${status}</span>
      </div>`;
    });
  }
  openSheet(`
    <div class="sheet-title">选择记录批次</div>
    <div class="sheet-body">
      <div style="background:var(--bg);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text-2);margin-bottom:12px;">${g.name} · 共 ${plan.length} 批。点击某一批，为该批填写实际解锁信息。</div>
      ${items}
    </div>
    <div class="sheet-actions">
      <button class="btn-secondary" onclick="closeSheet()">取消</button>
    </div>
  `);
}

// 查找某批次对应的解锁记录：优先精确 batch，否则按股数/日期综合评分匹配（兼容游离记录，无硬性天数限制）
// 批次表单 showVestSheet 与删除 deleteVestBatch 共用此逻辑，保证"能显示删除按钮就一定能删掉"
function findVestForBatch(g, batch) {
  const vests = g.vests || [];
  const exact = vests.find(v => v.batch === batch);
  if (exact) return exact;
  if (!vests.length) return null;
  const plan = computeVestPlan(g);
  const planBatch = plan.find(p => p.batch === batch);
  if (!planBatch) return null;
  const pd = new Date(planBatch.date);
  const perShare = planBatch.shares;
  const usedIds = new Set(vests.filter(v => v.batch != null).map(v => v.id));
  let best = null, bestScore = Infinity;
  vests.forEach(v => {
    if (usedIds.has(v.id)) return;   // 已被其他批次占用
    const shareDiff = Math.abs((v.shares||0) - perShare);
    const dayDiff = Math.abs((new Date(v.date) - pd) / 86400000);
    const score = shareDiff * 10 + dayDiff;   // 股数差异权重更高
    if (score < bestScore) { best = v; bestScore = score; }
  });
  return (best && bestScore < perShare * 5) ? best : null;   // 股数差异不超过50%即合理匹配
}

// 记/编辑解锁：batch 指定批次时，直接挂到解禁计划的对应批次上（不再单独加一笔）
function showVestSheet(eqId, batch, from) {
  const g = (state.equity || []).find(x => x.id === eqId);
  if (!g) return;
  const now = new Date();
  const localNow = new Date(now.getTime() - now.getTimezoneOffset()*60000).toISOString().slice(0,16);
  const remain = getEquityRemaining(g);

  // 批次模式：查找该批次已有的解锁记录（预填）
  let existing = null;
  if (batch) existing = findVestForBatch(g, batch);
  // 预填日期（existing 存在时取实际解锁时间），统一用本地时区折算，避免字符串减数字产生 NaN
  const exLocal = existing
    ? new Date(new Date(existing.date).getTime() - new Date(existing.date).getTimezoneOffset() * 60000).toISOString().slice(0, 16)
    : '';
  const title = batch ? `第${batch}批解锁` : '记一笔解禁';
  const sub = batch
    ? `计划 ${Math.round((Number(g.totalShares)||0) / (parseInt(g.vestBatches)||1)).toLocaleString('zh-CN')} 股 · 填写实际解锁信息`
    : `当前剩余 <b style="color:var(--primary)">${Math.round(remain.shares).toLocaleString('zh-CN')}</b> 股（授予 ${Math.round(g.totalShares).toLocaleString('zh-CN')} 股）`;

  // 返回目标：从详情页进入则回到详情页，从批次选择器进入则回到选择器
  const backTarget = from === 'picker' ? { type: 'vestPicker', eqId } : { type: 'equityDetail', eqId };

  openSheet(`
    <div class="sheet-title">${title}</div>
    <div class="sheet-body">
      <div style="background:var(--bg);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text-2);margin-bottom:12px;">${sub}</div>
      <div class="form-group">
        <label class="form-label">解锁日期</label>
        <input type="datetime-local" class="form-input" id="vestDate" value="${existing ? exLocal : localNow}">
      </div>
      <div class="form-group">
        <label class="form-label">解锁股数（股）</label>
        <input type="number" class="form-input amount-input" id="vestShares" placeholder="实际解锁股数" step="1" value="${existing ? existing.shares : ''}">
      </div>
      <div class="form-group">
        <label class="form-label">解锁金额（元）</label>
        <input type="number" class="form-input amount-input" id="vestAmount" placeholder="实际解锁对应金额" step="0.01" value="${existing ? existing.amount : ''}">
      </div>
      <div class="form-group">
        <label class="form-label">备注（选填）</label>
        <input type="text" class="form-input" id="vestNote" placeholder="如：解锁价格19.91（含分红）" value="${existing ? (existing.note||'') : ''}">
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn-primary" onclick="saveVest('${eqId}', ${batch ? batch : 'null'})">保存</button>
      ${existing ? `<button class="btn-danger" onclick="deleteVestBatch('${eqId}', ${batch ? batch : 'null'})">删除</button>` : ''}
      <button class="btn-secondary" onclick="closeSheet(true)">返回</button>
    </div>
  `, backTarget);
}

// 保存解锁：按批次精确 upsert（同批次只保留一条），避免重复加一笔
function saveVest(eqId, batch) {
  const g = (state.equity || []).find(x => x.id === eqId);
  if (!g) return;
  const date = document.getElementById('vestDate').value;
  const shares = parseFloat(document.getElementById('vestShares').value);
  const amount = parseFloat(document.getElementById('vestAmount').value);
  const note = document.getElementById('vestNote').value.trim();
  if (!date) { toast('请选择解锁日期'); return; }
  if (isNaN(shares) || shares <= 0) { toast('请输入有效解锁股数'); return; }
  g.vests = g.vests || [];
  if (batch) {
    const idx = g.vests.findIndex(v => v.batch === batch);
    const rec = { batch: batch, date: new Date(date).toISOString(), shares: shares, amount: isNaN(amount) ? 0 : amount, note: note };
    if (idx >= 0) g.vests[idx] = rec;                 // 更新已有批次记录
    else g.vests.push(rec);                            // 新增批次记录
  } else {
    g.vests.push({ id: uid(), date: new Date(date).toISOString(), shares: shares, amount: isNaN(amount) ? 0 : amount, note: note });
  }
  saveData();
  closeSheet();
  render();
  toast(batch ? `第${batch}批解锁已保存` : '已记录解禁');
}

function editVest(eqId, vid) {
  const g = (state.equity || []).find(x => x.id === eqId);
  if (!g) return;
  const v = (g.vests || []).find(x => x.id === vid);
  if (!v) return;
  const d = new Date(v.date);
  const localDate = new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16);
  openSheet(`
    <div class="sheet-title">编辑解禁记录</div>
    <div class="sheet-body">
      <div class="form-group">
        <label class="form-label">解禁日期</label>
        <input type="datetime-local" class="form-input" id="vestDate" value="${localDate}">
      </div>
      <div class="form-group">
        <label class="form-label">解禁股数（股）</label>
        <input type="number" class="form-input amount-input" id="vestShares" value="${v.shares}" step="1">
      </div>
      <div class="form-group">
        <label class="form-label">解禁金额（元）</label>
        <input type="number" class="form-input amount-input" id="vestAmount" value="${v.amount}" step="0.01">
      </div>
      <div class="form-group">
        <label class="form-label">备注</label>
        <input type="text" class="form-input" id="vestNote" value="${v.note||''}">
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn-primary" onclick="updateVest('${eqId}','${vid}')">更新</button>
      <button class="btn-danger" onclick="deleteVest('${eqId}','${vid}')">删除</button>
      <button class="btn-secondary" onclick="closeSheet()">取消</button>
    </div>
  `);
}

function updateVest(eqId, vid) {
  const g = (state.equity || []).find(x => x.id === eqId);
  if (!g) return;
  const v = (g.vests || []).find(x => x.id === vid);
  if (!v) return;
  const date = document.getElementById('vestDate').value;
  const shares = parseFloat(document.getElementById('vestShares').value);
  const amount = parseFloat(document.getElementById('vestAmount').value);
  const note = document.getElementById('vestNote').value.trim();
  if (!date) { toast('请选择解禁日期'); return; }
  if (isNaN(shares) || shares <= 0) { toast('请输入有效解禁股数'); return; }
  v.date = new Date(date).toISOString();
  v.shares = shares;
  v.amount = isNaN(amount) ? 0 : amount;
  v.note = note;
  saveData();
  closeSheet();
  render();
  toast('已更新');
}

function deleteVest(eqId, vid) {
  if (!confirm('确定删除这条解禁记录吗？删除后不可恢复。')) return;
  const g = (state.equity || []).find(x => x.id === eqId);
  if (!g) return;
  g.vests = (g.vests || []).filter(x => x.id !== vid);
  saveData();
  render();
  showEquityDetail(eqId);
  toast('解禁记录已删除');
}

// 按批次删除解锁记录（与批次表单 showVestSheet 同一匹配逻辑，确保能删掉游离记录并正确更新进度）
function deleteVestBatch(eqId, batch) {
  if (!batch) return;
  if (!confirm('确定删除第' + batch + '批的解锁记录吗？删除后不可恢复。')) return;
  const g = (state.equity || []).find(x => x.id === eqId);
  if (!g) return;
  const vests = g.vests || [];
  const target = findVestForBatch(g, batch);
  if (!target) { toast('未找到该批次的解锁记录'); return; }
  // 游离记录有 id 按 id 删；批次记录无 id 按 batch 删
  if (target.id) g.vests = vests.filter(v => v.id !== target.id);
  else g.vests = vests.filter(v => v.batch !== batch);
  saveData();
  closeSheet();
  render();
  showEquityDetail(eqId);
  toast('第' + batch + '批解锁记录已删除');
}

function showEditEquitySheet(eqId) {
  const g = (state.equity || []).find(x => x.id === eqId);
  if (!g) return;
  const gd = g.grantDate ? fmtDateInput(new Date(g.grantDate)) : fmtDateInput(new Date());
  // 从名称中提取年份（如 "2025年中长期激励" -> 2025）
  const nameYearMatch = g.name.match(/^(\d{4})/);
  const editYear = nameYearMatch ? nameYearMatch[1] : new Date().getFullYear();
  openSheet(`
    <div class="sheet-title">编辑股权激励</div>
    <div class="sheet-body eq-form">
      <div class="form-group">
        <label class="form-label">授予年份</label>
        <input type="number" class="form-input" id="editEqYear" value="${editYear}" min="2000" max="2099">
        <div style="font-size:11px;color:var(--text-3);margin-top:4px;">自动命名为"${editYear}年中长期激励"</div>
      </div>
      <div class="form-group">
        <label class="form-label">股权激励金额（元）</label>
        <input type="number" class="form-input amount-input" id="editEqAmount" value="${g.totalAmount}" step="0.01">
      </div>
      <div class="form-group">
        <label class="form-label">股票授予价格（元/股）</label>
        <input type="number" class="form-input amount-input" id="editEqPrice" value="${g.grantPrice}" step="0.01">
      </div>
      <div class="form-group">
        <label class="form-label">股数（授予总股数）</label>
        <input type="number" class="form-input amount-input" id="editEqShares" value="${g.totalShares}" step="1">
      </div>
      <div class="form-group">
        <label class="form-label">授予日期</label>
        <input type="date" class="form-input" id="editEqGrantDate" value="${gd}">
      </div>
      <div style="background:var(--bg);border-radius:10px;padding:12px;margin:4px 0 4px;">
        <div style="font-size:13px;font-weight:600;color:var(--text-1,#1d1d1f);margin-bottom:6px;">解禁计划</div>
        <div style="font-size:11px;color:var(--text-3);margin-bottom:10px;line-height:1.5;">按固定规则自动生成：首批次年9月、后续从第3年起每年2月。</div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">解禁批次（次）</label>
          <input type="number" class="form-input amount-input" id="editEqVestBatches" value="${g.vestBatches||''}" step="1" min="1">
        </div>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn-primary" onclick="updateEquity('${eqId}')">保存</button>
      <button class="btn-secondary" onclick="closeSheet()">取消</button>
    </div>
  `);
}

function updateEquity(eqId) {
  const g = (state.equity || []).find(x => x.id === eqId);
  if (!g) return;
  const yearVal = document.getElementById('editEqYear').value.trim();
  const year = parseInt(yearVal) || new Date().getFullYear();
  const name = year + '年中长期激励';
  const totalAmount = parseFloat(document.getElementById('editEqAmount').value);
  const grantPrice = parseFloat(document.getElementById('editEqPrice').value);
  const totalShares = parseFloat(document.getElementById('editEqShares').value);
  if (isNaN(totalShares) || totalShares <= 0) { toast('请输入有效股数'); return; }
  const gd = document.getElementById('editEqGrantDate').value;
  const vestBatches = parseInt(document.getElementById('editEqVestBatches').value) || 0;
  g.name = name || '股权激励';
  g.totalAmount = isNaN(totalAmount) ? 0 : totalAmount;
  g.grantPrice = isNaN(grantPrice) ? 0 : grantPrice;
  g.totalShares = totalShares;
  g.grantDate = gd ? new Date(gd + 'T00:00:00').toISOString() : new Date().toISOString();
  g.vestBatches = vestBatches;
  g.vestStartYear = VEST_RULE.firstStartYear;
  g.vestFirstMonth = VEST_RULE.firstMonth;
  g.vestRestStartYear = VEST_RULE.restStartYear;
  g.vestRestMonth = VEST_RULE.restMonth;
  g.vestRestInterval = VEST_RULE.restInterval;
  saveData();
  closeSheet();
  render();
  toast('已更新');
}

function deleteEquity(eqId) {
  if (!confirm('确定删除这笔股权激励吗？含全部解禁记录，删除后不可恢复。')) return;
  state.equity = state.equity.filter(x => x.id !== eqId);
  saveData();
  closeSheet();
  render();
  toast('已删除');
}

// ===== 初始化 =====
applyTheme();
applyAmountToggle();
loadData();
render();

// 点击遮罩关闭
document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeSheet();
});

// ===== PWA 注册 =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    // 用 ?v=10 强制浏览器每次重新拉 sw.js（绕开 HTTP 缓存），确保 SW 能升级到 v10
    navigator.serviceWorker.register('./sw.js?v=10').then((reg) => {
      // 检测到新 SW 安装成功（说明发布过新版），自动激活并刷新
      reg.addEventListener('updatefound', () => {
        const newSw = reg.installing;
        if (!newSw) return;
        newSw.addEventListener('statechange', () => {
          if (newSw.state === 'activated') {
            // 新 SW 已激活，下次访问就是新版；当前页强制刷新一次以立刻看到
            if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
            console.log('存款记：检测到新版本，已激活');
          }
        });
      });
      // 监听 controller 变化（新 SW 接管），自动刷新页面
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    }).catch((err) => console.warn('SW 注册失败:', err));
  });

  // 提供一个手动清缓存入口（仅在用户主动调用时触发）
  window.clearAppCache = async function() {
    try {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) await r.unregister();
      const keys = await caches.keys();
      for (const k of keys) await caches.delete(k);
      localStorage.removeItem('__cacheClearedAt');
      localStorage.setItem('__cacheClearedAt', String(Date.now()));
      return true;
    } catch (e) {
      console.error('清缓存失败', e);
      return false;
    }
  };
}
